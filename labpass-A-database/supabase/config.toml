# Supabase CLI configuration for LabPass.
# Local stack: `supabase start`. Hosted project: `supabase link`, then `supabase db push`
# for the schema and `supabase config push` for the [auth] settings below.

project_id = "labpass"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]   # `private` (internal helpers) is deliberately not exposed
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Turn on once supabase/seed.sql (demo university, users, roles, resources) exists.
enabled = false
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
# Local email viewer for confirmation and password-reset mails: http://localhost:54324
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"
# Buckets (resource-photos, condition-photos, certificates) and their policies are created by the
# migration, so local and hosted projects get the same setup.

# ---------------------------------------------------------------------------
# Auth: email + password only (FR-01). Roles are never taken from sign-up data;
# new users become students and staff roles are assigned from seed data.
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://*.vercel.app/auth/callback",   # Vercel preview links; add the production URL too
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = true
# "Any verified student": users must confirm their university email before signing in.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 10

[auth.external.apple]
enabled = false
[auth.external.google]
enabled = false
[auth.external.github]
enabled = false
